# Actualizaciones de dependencias. Las alertas y PRs de seguridad se
# activan en Settings → Advanced Security; esto agrega las de versión.
# Cada PR pasa por CI y por el ruleset de master como cualquier otro.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # La imagen sigue la misma versión de Python que CI y pyproject
      # (3.12): solo parches de la imagen, no saltos de versión.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
