# CI mínimo: lint + types + tests + build de la imagen.
#
# Deliberadamente NO corre contract tests contra homologación (design.md
# §2.5): eso requeriría subir el certificado fiscal a un runner externo.
# Los contract tests se corren localmente (scripts/{get_ta,check_wsfex}.py).
# La suite acá es autocontenida: certificado autofirmado de prueba y ARCA
# simulada con MockTransport — cero red, cero secretos.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# Token de solo lectura para todos los jobs. Las actions van fijadas a un
# SHA de commit (versión en el comentario): un tag movido no cambia lo que
# corre acá. Dependabot propone las actualizaciones.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # age/age-keygen: el seed se cifra a recipients; los tests
      # ejercitan round-trip real (sin loguear plaintext/secretos).
      # Binario oficial del release (versión y checksum fijos): el paquete
      # apt no es uniforme entre runners.
      - name: Instalar age
        run: |
          curl -fsSL "https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz" -o /tmp/age.tar.gz
          echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  /tmp/age.tar.gz" | sha256sum -c -
          tar -xzf /tmp/age.tar.gz -C /tmp
          sudo install -m 755 /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
          age --version
          age-keygen --version
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q

  docker:
    # La imagen es el runtime real (design.md §2.5); un Dockerfile roto se
    # detectaría recién al levantar la app si no se buildea acá.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t facturador:ci .

  secrets:
    # Escanea TODO el historial (no solo el diff del PR): el repo es público
    # y un secreto en cualquier commit queda expuesto. Falsos positivos
    # conocidos en .gitleaks.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: gitleaks
        run: /tmp/gitleaks git --no-banner --redact --verbose .
