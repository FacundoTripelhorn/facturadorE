# CI mínimo: lint + types + tests + build de la imagen.
#
# Deliberadamente NO corre contract tests contra homologación (design.md
# §2.5): eso requeriría subir el certificado fiscal a un runner externo.
# Los contract tests se corren localmente (scripts/{get_ta,check_wsfex}.py).
# La suite acá es autocontenida: certificado autofirmado de prueba y ARCA
# simulada con MockTransport — cero red, cero secretos.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # age/age-keygen: el seed se cifra a recipients; los tests
      # ejercitan round-trip real (sin loguear plaintext/secretos).
      # Binario oficial: el paquete apt no es uniforme entre runners.
      - name: Instalar age
        run: |
          curl -fsSL "https://dl.filippo.io/age/v1.2.1?for=linux/amd64" -o /tmp/age.tar.gz
          tar -xzf /tmp/age.tar.gz -C /tmp
          sudo install -m 755 /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
          age --version
          age-keygen --version
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q

  docker:
    # La imagen es el runtime real (design.md §2.5); un Dockerfile roto se
    # detectaría recién al levantar la app si no se buildea acá.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t facturador:ci .
