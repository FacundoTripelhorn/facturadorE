# CI mínimo: el check compartido, lint + types, tests y build de la imagen.
# Cada job corre una receta de `just`: lo que pasa en tu máquina es lo que
# corre acá (docs/agent/rules/ci.md).
#
# Deliberadamente NO corre contract tests contra homologación (design.md
# §2.5): eso requeriría subir el certificado fiscal a un runner externo.
# Los contract tests se corren localmente (scripts/{get_ta,check_wsfex}.py).
# La suite acá es autocontenida: certificado autofirmado de prueba y ARCA
# simulada con MockTransport — cero red, cero secretos.
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]  # el job standards controla que el tag coincida con pyproject.toml
  pull_request:

# Token de solo lectura para todos los jobs. Las actions van fijadas a un
# SHA de commit (versión en el comentario): un tag movido no cambia lo que
# corre acá. Dependabot propone las actualizaciones.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standards:
    # Check compartido de agent-standards: project.yml, título del PR, tamaño
    # de archivos y funciones, supresiones, actions fijadas, tag de release y
    # secretos (gitleaks sobre TODO el historial: el repo es público). Los
    # falsos positivos conocidos de gitleaks siguen en .gitleaks.toml.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: FacundoTripelhorn/agent-standards@18286187ac1a26df973ada1a1f0dccd00daf6f5f # v0.9.0
        with:
          mode: warn

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: FacundoTripelhorn/agent-standards/setup-just@18286187ac1a26df973ada1a1f0dccd00daf6f5f # v0.9.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: just check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: FacundoTripelhorn/agent-standards/setup-just@18286187ac1a26df973ada1a1f0dccd00daf6f5f # v0.9.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # age/age-keygen: el seed se cifra a recipients; los tests
      # ejercitan round-trip real (sin loguear plaintext/secretos).
      # Binario oficial del release (versión y checksum fijos): el paquete
      # apt no es uniforme entre runners.
      - name: Instalar age
        run: |
          curl -fsSL "https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz" -o /tmp/age.tar.gz
          echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  /tmp/age.tar.gz" | sha256sum -c -
          tar -xzf /tmp/age.tar.gz -C /tmp
          sudo install -m 755 /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
          age --version
          age-keygen --version
      - run: just test

  build:
    # La imagen es el runtime real (design.md §2.5); un Dockerfile roto se
    # detectaría recién al levantar la app si no se buildea acá.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: FacundoTripelhorn/agent-standards/setup-just@18286187ac1a26df973ada1a1f0dccd00daf6f5f # v0.9.0
      - run: just build
