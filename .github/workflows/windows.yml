# Build del ejecutable de Windows (PyInstaller) + smoke headless.
#
# PRs y master: construye la carpeta portable, corre el smoke sin pantalla
# (packaging/windows/smoke_ci.py) y sube el zip como artifact.
# Tag v*: además publica FacturadorE-windows-<tag>.zip en un GitHub Release.
# El chooser, la ventana, el cambio de ambiente y el cierre se prueban a
# mano en la PC (docs/windows-smoke-test.md).
name: Windows

# Sin permisos por defecto: cada job declara los suyos.
permissions: {}

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    paths:
      - "facturador/**"
      - "packaging/windows/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          # Misma versión que el resto del proyecto: el build no depende de
          # qué Python traiga el runner.
          python-version: "3.12"
      - name: Versión
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" }
          else { $v = "dev-" + "${{ github.sha }}".Substring(0, 7) }
          "value=$v" >> $env:GITHUB_OUTPUT
      - name: Build
        shell: pwsh
        run: packaging/windows/build.ps1 -Version ${{ steps.version.outputs.value }}
      - name: Smoke headless
        shell: pwsh
        run: uv run python packaging/windows/smoke_ci.py packaging/windows/dist/FacturadorE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FacturadorE-windows-${{ steps.version.outputs.value }}
          path: packaging/windows/dist/FacturadorE-windows-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error

  release:
    # Solo este job puede escribir en el repo (crear el Release) y firmar
    # la atestación de procedencia del zip.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: FacturadorE-windows-${{ needs.build.outputs.version }}
      # Prueba verificable de que el zip salió de este workflow y este
      # commit: gh attestation verify <zip> --repo <owner>/<repo>.
      # GitHub solo emite atestaciones en repos públicos (o Enterprise).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: FacturadorE-windows-${{ github.ref_name }}.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "FacturadorE-windows-${{ github.ref_name }}.zip"
          --repo "${{ github.repository }}"
          --title "FacturadorE ${{ github.ref_name }}"
          --generate-notes
