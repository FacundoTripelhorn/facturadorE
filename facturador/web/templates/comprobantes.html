{% extends "base.html" %}
{% block content %}

{% if error %}
<div class="panel error">
  <div><strong>No se pudo sincronizar.</strong> {{ error }}</div>
</div>
{% endif %}
{% if aviso %}
<div class="panel ok">
  <div>{{ aviso }}</div>
</div>
{% endif %}

<section class="card">
  <h2>Comprobantes</h2>
  <nav class="tabs">
    {% for tab, label in tabs.items() %}
    <a href="/comprobantes?estado={{ tab }}"
       {% if tab == estado %}aria-current="page"{% endif %}>
      {{ label }} <span class="conteo num">{{ tab_counts[tab] }}</span>
    </a>
    {% endfor %}
  </nav>
  <div class="tabla-scroll">
    {% include "_listado.html" %}
  </div>
</section>

{% endblock %}
