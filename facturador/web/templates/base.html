<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>facturador — {{ env_label }}</title>
<script src="/static/htmx.min.js"></script>
<style>
  :root {
    --marino: #101c3d;
    --marino-2: #1b2b5e;
    --fondo: #eef1f6;
    --superficie: #ffffff;
    --tinta: #182033;
    --tinta-suave: #5b6474;
    --borde: #e2e6ee;
    --acento: #2452e0;
    --acento-hover: #1c42b8;
    --ok: #117a3d;
    --ok-fondo: #e9f9f0;
    --error: #b42318;
    --error-fondo: #fef3f2;
    --aviso: #b54708;
    --aviso-fondo: #fff7e6;
    --radio: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--fondo); color: var(--tinta);
    line-height: 1.5; font-size: 15px;
  }
  .num { font-variant-numeric: tabular-nums; }

  /* ---- barra superior ---- */
  header {
    background: linear-gradient(90deg, var(--marino), var(--marino-2));
    color: #fff; padding: 0 1.25rem;
  }
  header .adentro {
    max-width: 980px; margin: 0 auto; display: flex; align-items: center;
    gap: 1.5rem; height: 3.4rem;
  }
  header .titulo {
    font-weight: 800; font-size: 1.1rem; letter-spacing: -.02em;
    margin-right: auto;
  }
  header .titulo span { color: #8fb0ff; }
  header a {
    color: rgba(255,255,255,.75); text-decoration: none; font-weight: 600;
    font-size: .92rem; padding: .35rem .1rem; border-bottom: 2px solid transparent;
  }
  header a:hover { color: #fff; }
  header a[aria-current="page"] { color: #fff; border-bottom-color: #8fb0ff; }
  .badge-env {
    border-radius: 999px;
    padding: .18rem .75rem; font-size: .75rem; font-weight: 650;
    letter-spacing: .02em; white-space: nowrap;
  }
  /* Homologación: aviso visible. */
  .badge-env.homo {
    background: rgba(255, 205, 90, .15); color: #ffd76e;
    border: 1px solid rgba(255, 205, 90, .45);
  }
  /* Producción: distinta pero calmada — no grita, sí identifica. */
  .badge-env.prod {
    background: rgba(255, 255, 255, .12); color: #d7e4ff;
    border: 1px solid rgba(215, 228, 255, .4);
  }
  .cambiar-ambiente {
    margin: 0; display: inline;
  }
  .cambiar-ambiente button {
    background: transparent; border: 1px solid rgba(255,255,255,.35);
    color: rgba(255,255,255,.9); font: inherit; font-size: .75rem;
    font-weight: 650; padding: .18rem .65rem; border-radius: 999px;
    cursor: pointer; letter-spacing: .01em; white-space: nowrap;
  }
  .cambiar-ambiente button:hover {
    background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.55);
    color: #fff;
  }

  main { max-width: 980px; margin: 0 auto; padding: 1.75rem 1.25rem 4rem; }

  /* ---- cards ---- */
  .card {
    background: var(--superficie); border: 1px solid var(--borde);
    border-radius: var(--radio); margin-bottom: 1.4rem;
    box-shadow: 0 1px 3px rgba(16, 24, 40, .06), 0 8px 24px -18px rgba(16, 24, 40, .25);
    overflow: hidden;
  }
  .card > h2 {
    margin: 0; padding: 1rem 1.5rem; font-size: .95rem; font-weight: 700;
    border-bottom: 1px solid var(--borde); background: #fafbfd;
    display: flex; align-items: baseline; gap: .6rem;
  }
  .card > h2 .sub { color: var(--tinta-suave); font-weight: 450; font-size: .85rem; }
  .card .cuerpo { padding: 1.25rem 1.5rem 1.5rem; }

  /* ---- formularios ---- */
  label { display: block; margin: .9rem 0 .3rem; font-size: .78rem;
          font-weight: 650; color: var(--tinta-suave); text-transform: uppercase;
          letter-spacing: .04em; }
  input, select, textarea {
    width: 100%; padding: .6rem .75rem; font: inherit; color: inherit;
    border: 1px solid var(--borde); border-radius: 8px; background: #fff;
    transition: border-color .1s, box-shadow .1s;
  }
  input:focus, select:focus {
    outline: none; border-color: var(--acento);
    box-shadow: 0 0 0 3px rgba(36, 82, 224, .14);
  }
  #imp_total { font-size: 1.55rem; font-weight: 650; padding: .45rem .75rem; }
  .fila { display: flex; gap: 1.1rem; flex-wrap: wrap; align-items: end; }
  .fila > div { flex: 1; min-width: 190px; }
  .check { display: flex; align-items: center; gap: .5rem; margin-top: 1.1rem;
           font-size: .9rem; font-weight: 450; }
  .check input { width: auto; }

  button {
    padding: .65rem 1.6rem; border: 0; border-radius: 8px; font: inherit;
    font-weight: 650; background: var(--acento); color: #fff; cursor: pointer;
    margin-top: 1.2rem; box-shadow: 0 1px 2px rgba(16, 24, 40, .15);
    transition: background .1s, transform .05s;
  }
  button:hover { background: var(--acento-hover); }
  button:active { transform: translateY(1px); }
  button.secundario {
    background: #fff; color: var(--tinta-suave);
    border: 1px solid var(--borde); margin: 0; padding: .3rem .85rem;
    font-size: .82rem; font-weight: 600; box-shadow: none;
  }
  button.secundario:hover { color: var(--tinta); border-color: #b8c0cf; background: #fff; }

  .spinner { display: none; width: 1em; height: 1em; vertical-align: -.15em;
             border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
             border-radius: 50%; animation: girar .7s linear infinite; }
  .htmx-request .spinner, .spinner.htmx-request { display: inline-block; }
  .htmx-request button[type=submit] { opacity: .7; pointer-events: none; }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* ---- tablas ---- */
  .tabla-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .89rem; }
  th {
    text-align: left; padding: .55rem .9rem; color: var(--tinta-suave);
    font-size: .7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; border-bottom: 1px solid var(--borde);
    background: #fafbfd;
  }
  th:first-child, td:first-child { padding-left: 1.5rem; }
  th:last-child, td:last-child { padding-right: 1.5rem; }
  td { padding: .7rem .9rem; border-bottom: 1px solid var(--borde); }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: #f7f9fc; }
  td.num, th.num { text-align: right; }
  td.num { white-space: nowrap; }

  .estado {
    display: inline-flex; align-items: center; gap: .45rem;
    border-radius: 999px; padding: .16rem .7rem; font-size: .78rem;
    font-weight: 650; background: #eef1f6; color: var(--tinta-suave);
    white-space: nowrap;
  }
  .estado::before { content: ""; width: .48rem; height: .48rem;
                    border-radius: 50%; background: currentColor; }
  .estado.authorized { background: var(--ok-fondo); color: var(--ok); }
  .estado.rejected { background: var(--error-fondo); color: var(--error); }
  .estado.unknown { background: var(--aviso-fondo); color: var(--aviso); }

  /* ---- paneles de resultado ---- */
  .panel { border-radius: var(--radio); padding: 1rem 1.3rem; margin-bottom: 1.4rem;
           border: 1px solid; font-size: .95rem; display: flex; gap: .9rem;
           align-items: flex-start; }
  .panel::before {
    font-size: 1rem; font-weight: 800; width: 1.7rem; height: 1.7rem;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: .1rem;
  }
  .panel.ok { background: var(--ok-fondo); border-color: #a9e8c3; color: #05502e; }
  .panel.ok::before { content: "✓"; background: var(--ok); color: #fff; }
  .panel.error { background: var(--error-fondo); border-color: #fecdca; color: #7a271a; }
  .panel.error::before { content: "!"; background: var(--error); color: #fff; }
  .panel .cae-grande { font-size: 1.1rem; font-weight: 750; }
  .panel a { color: inherit; font-weight: 700; }
  .panel p { margin: .4rem 0 0; }

  .panel.neutro { background: #f4f6fa; border-color: var(--borde); color: var(--tinta-suave); }
  .panel.neutro::before { content: "i"; background: var(--tinta-suave); color: #fff; }

  /* ---- paso de revisión (dos fases) ---- */
  .revisar { border-color: #c7d4f8; }
  .revisar > h2 { background: #f0f4ff; border-bottom-color: #c7d4f8; }
  .revisar-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: .75rem 1.5rem; margin-bottom: 1.1rem;
  }
  .revisar-grid dt { font-size: .72rem; font-weight: 650; color: var(--tinta-suave);
                     text-transform: uppercase; letter-spacing: .05em; }
  .revisar-grid dd { margin: .1rem 0 0; font-weight: 550; }
  table.items-revisar th, table.items-revisar td { padding: .45rem .6rem; }
  table.items-revisar th:first-child, table.items-revisar td:first-child { padding-left: .6rem; }
  table.items-revisar th:last-child, table.items-revisar td:last-child { padding-right: .6rem; }
  .total-revisar { text-align: right; font-size: 1.15rem; font-weight: 750;
                   margin: .9rem 0 0; }
  .acciones-revisar { display: flex; gap: .8rem; align-items: center; }
  .acciones-revisar .secundario { margin-top: 1.2rem; padding: .55rem 1.1rem; }

  /* ---- tabs de comprobantes ---- */
  .tabs { display: flex; gap: .25rem; padding: .6rem 1rem 0; background: #fafbfd;
          border-bottom: 1px solid var(--borde); }
  .tabs a {
    text-decoration: none; color: var(--tinta-suave); font-weight: 600;
    font-size: .88rem; padding: .45rem .85rem .55rem;
    border-bottom: 2px solid transparent;
  }
  .tabs a:hover { color: var(--tinta); }
  .tabs a[aria-current="page"] { color: var(--acento); border-bottom-color: var(--acento); }
  .tabs .conteo {
    background: #e8ecf3; color: var(--tinta-suave); border-radius: 999px;
    padding: .05rem .45rem; font-size: .72rem; font-weight: 650;
    margin-left: .15rem;
  }
  .tabs a[aria-current="page"] .conteo { background: #e3eaff; color: var(--acento); }

  .nota { color: var(--tinta-suave); font-size: .82rem; margin-top: .9rem; }
  .vacio { color: var(--tinta-suave); text-align: center; padding: 2rem 0;
           font-size: .9rem; }
  a { color: var(--acento); font-weight: 550; }
  @media (max-width: 640px) {
    main { padding-top: 1rem; }
    .card .cuerpo { padding: 1rem; }
    th, td { padding-left: 1rem; padding-right: 1rem; }
    .oculta-movil { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="adentro">
    <span class="titulo">factura<span>dor</span></span>
    <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Emitir</a>
    <a href="/comprobantes" {% if request.url.path == "/comprobantes" %}aria-current="page"{% endif %}>Comprobantes</a>
    <a href="/clientes" {% if request.url.path == "/clientes" %}aria-current="page"{% endif %}>Clientes</a>
    <a href="/configuracion" {% if request.url.path == "/configuracion" %}aria-current="page"{% endif %}>Configuración</a>
    <span class="badge-env {{ env }}" data-env="{{ env }}">
      {% if env == "prod" %}{{ env_label }}{% else %}{{ env_label }} — sin valor fiscal{% endif %}
    </span>
    {% if launcher_supervised %}
    <form class="cambiar-ambiente" method="post" action="/ui/cambiar-ambiente">
      <button type="submit" title="Cierra esta sesión y abre el selector de ambiente">
        Cambiar ambiente
      </button>
    </form>
    {% endif %}
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
