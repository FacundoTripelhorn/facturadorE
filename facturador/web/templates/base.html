<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>facturador</title>
<script src="/static/htmx.min.js"></script>
<style>
  :root { --borde: #ccc; --ok: #1a7f37; --error: #b42318; --aviso: #b54708; }
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto;
         padding: 0 1rem; color: #1c1c1c; }
  nav { display: flex; gap: 1rem; align-items: baseline; margin-bottom: 1.5rem;
        border-bottom: 1px solid var(--borde); padding-bottom: .6rem; }
  nav .titulo { font-weight: 700; font-size: 1.2rem; margin-right: auto; }
  nav a { color: inherit; }
  .badge-env { border: 1px solid var(--aviso); color: var(--aviso);
               border-radius: 4px; padding: .1rem .5rem; font-size: .8rem; }
  fieldset { border: 1px solid var(--borde); border-radius: 6px;
             margin-bottom: 1.5rem; padding: 1rem; }
  legend { font-weight: 600; padding: 0 .4rem; }
  label { display: block; margin: .6rem 0 .2rem; font-size: .9rem; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: .45rem;
          border: 1px solid var(--borde); border-radius: 4px; font: inherit; }
  .fila { display: flex; gap: 1rem; }
  .fila > div { flex: 1; }
  button { padding: .55rem 1.2rem; border: 0; border-radius: 5px; font: inherit;
           background: #0b57d0; color: #fff; cursor: pointer; margin-top: 1rem; }
  button.secundario { background: #6b7280; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--borde); }
  .estado { border-radius: 999px; padding: .1rem .6rem; font-size: .8rem;
            background: #eee; white-space: nowrap; }
  .estado.authorized { background: #d1f0dc; color: var(--ok); }
  .estado.rejected, .estado.unknown { background: #fde2dd; color: var(--error); }
  .panel { border-radius: 6px; padding: .8rem 1rem; margin-bottom: 1.2rem; }
  .panel.ok { background: #eefaf2; border: 1px solid var(--ok); }
  .panel.error { background: #fdf1ef; border: 1px solid var(--error); }
  .nota { color: #555; font-size: .85rem; }
</style>
</head>
<body>
<nav>
  <span class="titulo">facturador</span>
  <a href="/">Facturas</a>
  <a href="/clientes">Clientes</a>
  {% if env != "prod" %}<span class="badge-env">{{ env }} — sin valor fiscal</span>{% endif %}
</nav>
{% block content %}{% endblock %}
</body>
</html>
