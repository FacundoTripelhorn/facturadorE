[project]
name = "facturador"
version = "0.1.0"
description = "Emisión de Factura E (exportación) contra ARCA: API + frontend local"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "cryptography>=43",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "weasyprint>=69.0",
    "qrcode[pil]>=8.2",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "boto3>=1.35",
    "pywebview>=6.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
]

[tool.mypy]
python_version = "3.12"
files = ["facturador"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "weasyprint",
    "qrcode",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "webview",
    "webview.*",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["facturador"]
