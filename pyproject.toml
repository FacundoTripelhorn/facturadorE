[project]
name = "facturador"
version = "0.1.0"
description = "API para emisión de Factura E (exportación) contra ARCA — spike"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "cryptography>=43",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["facturador"]
